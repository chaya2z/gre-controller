[package]
name = "gre-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A declarative GRE tunnel controller for Linux"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ipnet = "2.12"
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.2", default-features = false, features = ["std", "serde", "parse"] }
