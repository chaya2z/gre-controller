[package]
name = "gre-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A declarative GRE tunnel controller for Linux"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3.34"
ipnet = "2.12"
rtnetlink = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }
toml = { version = "1.2", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros"] }
